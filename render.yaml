services:
  - type: web
    name: anps-erp
    env: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: anps-erp-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ANPS_ERP_HOST
        value: 0.0.0.0
      - key: ANPS_ERP_PORT
        value: 4174
      - key: ANPS_ERP_DATA_DIR
        value: /data
      - key: ANPS_ERP_DB
        value: /data/anps_erp.db
      - key: ANPS_ERP_BACKUP_DIR
        value: /data/backups
      - key: ANPS_ERP_UPLOAD_DIR
        value: /data/uploads
      - key: ANPS_ERP_ALLOWED_ORIGINS
        value: "*"
      - key: ANPS_WRITE_DISABLED
        value: "true"
      - key: ANPS_WRITE_DISABLED_MESSAGE
        value: "Render copy is maintenance (read-only). Use https://anps.thebrainerp.com"
      - key: ANPS_CANONICAL_LIVE_HOST
        value: https://anps.thebrainerp.com
      - key: ANPS_BSFV_INTEGRATION_ENABLED
        value: "true"
      - key: ANPS_BSFV_SECRET_PROVIDER
        value: external
      - key: ANPS_BSFV_ENDPOINT
        value: https://npsf.thebrainerp.com/api/v1/integrations/anps/events
      - key: ANPS_BSFV_APPROVED_ENDPOINTS
        value: https://npsf.thebrainerp.com/api/v1/integrations/anps/events
      - key: ANPS_BSFV_KEY_ID
        value: anps-bsfv-prod-2026-08-a
      - key: ANPS_BSFV_HMAC_SECRET_FILE
        value: /etc/secrets/anps-bsfv-prod-2026-08-a
      - key: ANPS_BSFV_CF_ACCESS_CLIENT_ID_FILE
        value: /etc/secrets/cf-access-client-id
      - key: ANPS_BSFV_CF_ACCESS_CLIENT_SECRET_FILE
        value: /etc/secrets/cf-access-client-secret
      - key: ANPS_BSFV_SCHOOL_ID
        value: anps
      - key: ANPS_BSFV_SESSION_MAP
        value: '{"2026-27":"2026-27"}'
      - key: ANPS_BSFV_SOURCE_SYSTEM
        value: anps
      - key: ANPS_BSFV_ALLOWED_EVENT_TYPES
        value: anps.fee_collection.created,anps.fee_collection.corrected,anps.fee_collection.voided,anps.staff.created,anps.staff.updated,anps.staff.deactivated
      - key: ANPS_BSFV_PILOT_NOT_BEFORE
        value: "2026-08-30T01:49:02Z"
      - key: ANPS_ERP_API_TOKEN
        sync: false
      - key: ANPS_FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ANPS_FCM_SERVER_KEY
        sync: false
      - key: ANPS_ICICI_GATEWAY_ENABLED
        value: "false"
      - key: ANPS_ICICI_MERCHANT_ID
        sync: false
      - key: ANPS_ICICI_TERMINAL_ID
        sync: false
      - key: ANPS_ICICI_ACCESS_CODE
        sync: false
      - key: ANPS_ICICI_SECRET_KEY
        sync: false
      - key: ANPS_ICICI_ENCRYPTION_KEY
        sync: false
      - key: ANPS_ICICI_PAYMENT_URL
        sync: false
      - key: ANPS_ICICI_RETURN_URL
        sync: false
      - key: ANPS_ICICI_WEBHOOK_SECRET
        sync: false
      - key: SMART_BUS_TRACKING_BASE_URL
        sync: false
      - key: SMART_BUS_TRACKING_DASHBOARD_URL
        sync: false
      - key: SMART_BUS_ERP_TOKEN
        sync: false
